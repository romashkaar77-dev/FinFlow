<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06100f"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>FinFlow — финансы</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#f4f9fb;background:#06100f;font-size:16px;--muted:#a7b9c2;--green:#19dfa4;--panel:#101e25;--stroke:#29404a;--red:#ff627e;--blue:#77b7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 0%,#064338 0,transparent 36%),#06100f;min-height:100dvh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}.app{max-width:850px;margin:auto;padding:20px 16px 112px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 22px}.brand{font-size:clamp(29px,7vw,42px);font-weight:900;letter-spacing:-1.4px}.brand span{color:var(--green)}.sub{color:var(--muted);font-size:15px;font-weight:600}.headActions{display:flex;gap:8px}.circle{width:46px;height:46px;border-radius:50%;border:1px solid var(--stroke);background:#11242b;color:white;font-size:22px}.tabs{display:flex;gap:5px;background:#111e27;border:1px solid var(--stroke);padding:5px;border-radius:21px;margin-bottom:18px}.tabs button{flex:1;min-width:0;border:0;border-radius:16px;padding:13px 3px;background:transparent;color:#b4c5d0;font-weight:800;font-size:clamp(11px,3vw,15px)}.tabs button.active{background:linear-gradient(135deg,#21eab4,#0bc08b);color:#03251b}.card{border:1px solid var(--stroke);background:linear-gradient(145deg,#15242e,#0d1820);border-radius:25px;padding:19px;margin-bottom:14px;box-shadow:0 9px 24px #0002}.tap{width:100%;text-align:left;color:inherit;display:block}.tap:active{transform:scale(.995)}.balance{background:radial-gradient(ellipse at 100% 100%,#06624d,#06332d 45%,#0c2529 100%);border-color:#12896a;min-height:178px}.eyebrow{font-size:16px;color:#b7d0d0;font-weight:750}.big{font-size:clamp(35px,9vw,59px);font-weight:900;letter-spacing:-1.5px;line-height:1.2;margin:16px 0 8px;overflow-wrap:anywhere}.muted{color:var(--muted)}.small{font-size:13px}.hint{font-size:14px;color:#a4d3c6;font-weight:650}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.stat{padding:15px 11px;min-height:139px}.stat .label{font-size:14px;line-height:1.3;font-weight:800;color:#d5e0e5}.stat .number{font-size:clamp(17px,4vw,26px);font-weight:900;line-height:1.25;margin-top:20px;overflow-wrap:anywhere}.income{background:linear-gradient(145deg,#063f35,#082a2a);border-color:#087e62}.expense{background:linear-gradient(145deg,#44212d,#211923);border-color:#8a354f}.net{background:linear-gradient(145deg,#123c67,#121f38);border-color:#2569a3}.green{color:#36e7a7}.red{color:#ff738c}.blue{color:#8fc2ff}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.sectionHead h2{font-size:23px;margin:0;font-weight:850;letter-spacing:-.5px}.link{background:#192b36;border:1px solid #2a4453;border-radius:15px;padding:9px 11px;color:#e7f2f5;font-size:14px;font-weight:750}.donutrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.donut{width:160px;height:160px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}.hole{width:108px;height:108px;background:#101e25;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:16px;font-weight:850}.legend{flex:1;min-width:145px}.legendItem{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:15px;font-weight:700}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}.transaction{display:flex;align-items:center;gap:12px;background:#15242d;border:1px solid #203641;padding:13px 12px;border-radius:16px;width:100%;text-align:left;color:inherit;margin:8px 0}.transaction .emoji{font-size:24px;background:#24404b;border-radius:13px;width:43px;height:43px;display:grid;place-items:center;flex-shrink:0}.transaction .details{min-width:0;flex:1}.transaction strong{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.transaction .amount{font-size:16px;font-weight:850;white-space:nowrap}.pageTitle{font-size:29px;font-weight:900;letter-spacing:-.6px;margin:0 0 7px}.back{border:0;background:transparent;color:var(--green);font-size:16px;font-weight:800;padding:8px 0;margin-bottom:10px}.field{margin:13px 0}.field label{display:block;font-size:15px;font-weight:800;color:#cbdce3;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid #36505b;background:#13252e;color:#fff;border-radius:14px;padding:14px;font-size:17px;font-weight:650;min-height:50px}textarea{resize:vertical;min-height:80px}.formGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.primary{border:0;background:linear-gradient(135deg,#2af0b6,#0fba85);color:#05271f;padding:15px 18px;border-radius:16px;font-size:17px;font-weight:900}.secondary{border:1px solid #35515d;background:#172c35;color:#e9f3f5;padding:13px 16px;border-radius:15px;font-size:15px;font-weight:800}.danger{border:1px solid #814252;background:#3a202a;color:#ffacbc;padding:13px;border-radius:14px;font-weight:800}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.empty{padding:24px 8px;color:#a8b8c0;text-align:center;font-size:16px}.nav{position:fixed;bottom:0;left:0;right:0;background:#091a21f5;border-top:1px solid #29414b;backdrop-filter:blur(20px);padding:9px max(9px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:20}.nav button{background:none;border:0;color:#a5b9c5;font-size:13px;font-weight:850;min-width:0;flex:1;display:flex;align-items:center;flex-direction:column;gap:3px}.nav button .ico{font-size:26px}.nav button.active{color:var(--green)}.nav .plus{background:linear-gradient(140deg,#27edb4,#07bd86);border-radius:50%;color:#03291f;width:58px;height:58px;flex:0 0 58px;font-size:37px;font-weight:800;align-self:center;box-shadow:0 0 23px #0ec88a55}.miniRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #263c45;font-weight:750}.miniRow:last-child{border:0}.badge{border-radius:10px;background:#214238;color:#7cf4c6;padding:5px 9px;font-size:12px}.chipbar{display:flex;gap:7px;overflow:auto;margin:14px 0}.chip{border:1px solid #34505a;background:#172a33;color:#b9d0d9;border-radius:12px;padding:9px 13px;white-space:nowrap;font-weight:800}.chip.active{background:#14c994;color:#05271f}.notice{border-left:3px solid #21dba7;padding:12px;background:#12332f;border-radius:8px;font-size:14px;color:#c7e6dd}.settingsButton{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid #2c4652;border-radius:17px;background:#152831;color:white;text-align:left;padding:16px;margin:9px 0;font-weight:850;font-size:17px}.settingsButton small{display:block;color:var(--muted);font-size:13px;margin-top:4px}.settingsButton b{color:#20dfaa}.hidden{display:none!important}@media(max-width:380px){.app{padding-left:11px;padding-right:11px}.stat{padding:13px 8px}.stat .label{font-size:12px}.stat .number{font-size:16px}.nav button{font-size:11px}.formGrid{grid-template-columns:1fr}}@media(min-width:700px){.app{padding-top:35px}.nav{left:50%;transform:translateX(-50%);max-width:850px;border-radius:22px 22px 0 0}.stat .number{font-size:27px}}
</style></head><body><main class="app"><header class="head"><div><div class="brand">FIN<span>FLOW</span></div><div class="sub">Личные финансы · Семья · Бизнес</div></div><div class="headActions"><button class="circle" data-go="transactions" aria-label="Поиск">⌕</button><button class="circle" data-go="settings" aria-label="Настройки">⚙</button></div></header><div id="view"></div></main><nav class="nav" id="nav"><button data-go="home"><span class="ico">⌂</span>Главная</button><button data-go="transactions"><span class="ico">☷</span>Операции</button><button class="plus" data-go="add" aria-label="Добавить">+</button><button data-go="analytics"><span class="ico">▥</span>Аналитика</button><button data-go="settings"><span class="ico">⚙</span>Настройки</button></nav><input type="file" id="filePicker" accept=".json,.csv,text/csv,application/json" hidden><script>
'use strict';const KEY='finflow_v2',OLD='finflow_v1',CUR=['RUB','USD','EUR','CNY','GEL','AED','TRY','GBP','KZT','BYN'];const defaults={RUB:1,EUR:100,USD:92,CNY:12.7,GEL:34,AED:25,TRY:2.8,GBP:118,KZT:.2,BYN:28};const $=s=>document.querySelector(s);const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const now=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};let items=[];try{let a=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD)||'[]');items=Array.isArray(a)?a:[]}catch{}let base=localStorage.getItem('finflow_base_currency')||'RUB';if(!CUR.includes(base))base='RUB';let rates={...defaults};try{rates={...rates,...JSON.parse(localStorage.getItem('finflow_rates')||'{}')}}catch{}let scope='all',view='home',filterType='all',search='',editId=null,drillCategory=null;let budgets={};try{budgets=JSON.parse(localStorage.getItem('finflow_budgets')||'{}')||{}}catch{};const names={all:'Общий обзор',personal:'Личные',family:'Семья',business:'Бизнес'},colors=['#2586ff','#fa3597','#ffb44b','#26db9d','#af59ff','#17b6e5','#fb647b'];const fmt=(n,c=base)=>{try{return new Intl.NumberFormat('ru-RU',{style:'currency',currency:c,maximumFractionDigits:2}).format(Number(n)||0)}catch{return (Number(n)||0).toFixed(2)+' '+c}};const conv=x=>(Number(x.amount)||0)*(Number(rates[x.currency||'RUB'])||1);const match=x=>scope==='all'||x.scope===scope;const month=()=>now().slice(0,7);const total=(arr,t)=>arr.filter(x=>x.type===t).reduce((s,x)=>s+conv(x),0);const data=()=>items.filter(match);const mdata=()=>data().filter(x=>String(x.date||'').startsWith(month()));const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);const opt=(arr,v)=>arr.map(([k,l])=>`<option value="${escapeHTML(k)}" ${k===v?'selected':''}>${escapeHTML(l)}</option>`).join('');const currOpts=v=>opt(CUR.map(c=>[c,c]),v);const scopeOpts=v=>opt(Object.entries(names).filter(([k])=>k!=='all'),v);const panel=(title,body,extra='')=>`<section class="card"><div class="sectionHead"><h2>${title}</h2>${extra}</div>${body}</section>`;function persist(){localStorage.setItem(KEY,JSON.stringify(items));render()}function setView(v){view=v;window.scrollTo(0,0);render()}function chartData(){let cats={};mdata().filter(x=>x.type==='expense').forEach(x=>cats[x.category||'Другое']=(cats[x.category||'Другое']||0)+conv(x));return Object.entries(cats).sort((a,b)=>b[1]-a[1])}function pie(){let arr=chartData(),sum=arr.reduce((s,x)=>s+x[1],0);if(!sum)return `<div class="empty">Расходов за этот месяц пока нет. Нажми +, чтобы добавить первую операцию.</div>`;let cursor=0,grad=arr.map((x,i)=>{let a=cursor;cursor+=x[1]/sum*100;return `${colors[i%colors.length]} ${a}% ${cursor}%`}).join(',');return `<div class="donutrow"><div class="donut" style="background:conic-gradient(${grad})"><div class="hole">${fmt(sum)}<span class="small muted">Всего</span></div></div><div class="legend">${arr.map((x,i)=>`<button class="transaction" style="padding:8px;margin:4px 0" data-category="${encodeURIComponent(x[0])}"><span class="details"><span class="dot" style="background:${colors[i%colors.length]}"></span>${escapeHTML(x[0])}</span><strong>${Math.round(x[1]/sum*100)}%</strong></button>`).join('')}</div></div>`}function txRow(x){let neg=x.type==='expense';return `<button class="transaction" data-edit="${escapeHTML(x.id)}"><span class="emoji">${x.type==='income'?'💰':x.type==='transfer'?'🔄':'🧾'}</span><span class="details"><strong>${escapeHTML(x.category||'Без категории')}</strong><span class="small muted">${escapeHTML(x.date||'')} · ${escapeHTML(x.account||'Счёт')}</span></span><span class="amount ${neg?'red':x.type==='income'?'green':''}">${neg?'−':x.type==='income'?'+':''}${fmt(x.amount,x.currency||'RUB')}</span><span class="muted">›</span></button>`}function home(){let a=mdata(),all=data(),inc=total(a,'income'),exp=total(a,'expense'),bal=total(all,'income')-total(all,'expense');return `<div class="tabs">${Object.entries(names).map(([k,v])=>`<button data-scope="${k}" class="${scope===k?'active':''}">${v}</button>`).join('')}</div><button class="card balance tap" data-go="accounts"><div class="eyebrow">Общий баланс · ${base}　›</div><div class="big">${fmt(bal)}</div><div class="hint">Нажми, чтобы открыть счета и валюты</div></button><div class="stats"><button class="card stat income tap" data-type="income"><div class="label">↓ Доходы<br>за месяц</div><div class="number green">${fmt(inc)}</div></button><button class="card stat expense tap" data-type="expense"><div class="label">↑ Расходы<br>за месяц</div><div class="number red">${fmt(exp)}</div></button><button class="card stat net tap" data-go="analytics"><div class="label">⚖ Разница<br>за месяц</div><div class="number blue">${fmt(inc-exp)}</div></button></div>${panel('Аналитика расходов',pie(),'<button class="link" data-go="analytics">Подробнее ›</button>')}${panel('Последние операции',all.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,5).map(txRow).join('')||'<div class="empty">Операций пока нет</div>','<button class="link" data-go="transactions">Все ›</button>')}<div class="actions"><button class="secondary" data-action="export">↓ Экспорт CSV</button><button class="secondary" data-action="backup">☁ Резервная копия</button></div>`}function transactions(){let list=data().filter(x=>(filterType==='all'||x.type===filterType)&&(!drillCategory||x.category===drillCategory)&&(!search||[x.category,x.account,x.note,x.date,x.currency].join(' ').toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));return `<h1 class="pageTitle">Операции</h1><p class="muted">Нажми на операцию, чтобы изменить или удалить её.</p><div class="field"><input id="search" placeholder="Поиск по операциям" value="${escapeHTML(search)}"></div><div class="chipbar">${[['all','Все'],['income','Доходы'],['expense','Расходы'],['transfer','Переводы']].map(([k,v])=>`<button class="chip ${filterType===k?'active':''}" data-type="${k}">${v}</button>`).join('')}</div>${drillCategory?`<div class="notice">Категория: ${escapeHTML(drillCategory)} <button class="link" data-clear-category>Сбросить</button></div>`:''}${list.map(txRow).join('')||'<div class="card empty">По выбранным условиям операций нет</div>'}<button class="primary" style="width:100%" data-go="add">+ Добавить операцию</button>`}function analytics(){let a=mdata(),inc=total(a,'income'),exp=total(a,'expense');return `<h1 class="pageTitle">Аналитика</h1><p class="muted">${month()} · ${names[scope]}</p><div class="stats"><button class="card stat income tap" data-type="income"><div class="label">Доходы</div><div class="number green">${fmt(inc)}</div></button><button class="card stat expense tap" data-type="expense"><div class="label">Расходы</div><div class="number red">${fmt(exp)}</div></button><button class="card stat net tap" data-go="budgets"><div class="label">Разница</div><div class="number blue">${fmt(inc-exp)}</div></button></div>${panel('Расходы по категориям',pie())}${panel('Финансовые цели и лимиты',`<p class="muted">Задавай месячный лимит расходов для каждого раздела.</p><button class="primary" data-go="budgets">Открыть бюджеты ›</button>`)}${panel('По разделам',Object.entries(names).filter(([k])=>k!=='all').map(([k,v])=>{let a=items.filter(x=>x.scope===k&&String(x.date||'').startsWith(month()));return `<button class="settingsButton" data-scope="${k}"><span>${v}<small>Доходы ${fmt(total(a,'income'))} · Расходы ${fmt(total(a,'expense'))}</small></span><b>›</b></button>`}).join(''))}`}
function accounts(){let a=data(),bal=total(a,'income')-total(a,'expense'),by={};a.forEach(x=>{let name=x.account||'Без счёта';by[name]=(by[name]||0)+(x.type==='income'?conv(x):x.type==='expense'?-conv(x):0)});return `<button class="back" data-go="home">‹ На главную</button><h1 class="pageTitle">Счета и баланс</h1><div class="card balance"><div class="eyebrow">Общий баланс в ${base}</div><div class="big">${fmt(bal)}</div><p class="muted">Баланс рассчитан по внесённым операциям, без начальных остатков.</p></div>${panel('Счета',Object.entries(by).map(([k,v])=>`<button class="settingsButton" data-account="${encodeURIComponent(k)}"><span>${escapeHTML(k)}<small>Расчётный остаток</small></span><b>${fmt(v)} ›</b></button>`).join('')||'<div class="empty">Добавь операцию, чтобы появился счёт</div>')}${panel('Валюты',`<p class="muted">Основная валюта: <strong>${base}</strong>. Курсы задаются вручную.</p><button class="primary" data-go="currencies">Настроить валюты ›</button>`)}`}
function budgetsView(){let k=scope==='all'?'personal':scope;let limit=Number(budgets[k]||0),spent=total(items.filter(x=>x.scope===k&&String(x.date||'').startsWith(month())),'expense');return `<button class="back" data-go="analytics">‹ Аналитика</button><h1 class="pageTitle">Бюджеты</h1><p class="muted">Лимит расходов за текущий месяц</p><div class="card"><div class="field"><label>Раздел</label><select id="budgetScope">${scopeOpts(k)}</select></div><div class="field"><label>Лимит в ${base}</label><input id="budgetLimit" type="number" min="0" step="0.01" value="${limit}"></div><div class="miniRow"><span>Потрачено</span><strong class="red">${fmt(spent)}</strong></div><div class="miniRow"><span>Осталось</span><strong class="${limit-spent>=0?'green':'red'}">${limit?fmt(limit-spent):'Лимит не задан'}</strong></div><button class="primary" data-action="saveBudget">Сохранить лимит</button></div>`}
function currencies(){return `<button class="back" data-go="settings">‹ Настройки</button><h1 class="pageTitle">Валюты и курсы</h1><div class="notice">Курсы вводятся вручную и могут отличаться от банковских. Изменение валюты пересчитает отчёты, но не изменит суммы операций.</div><div class="card"><div class="field"><label>Основная валюта отчётов</label><select id="baseCurrency">${currOpts(base)}</select></div><div id="rateFields">${CUR.filter(c=>c!==base).map(c=>`<div class="field"><label>1 ${c} = сколько ${base}?</label><input data-rate="${c}" type="number" min="0.000001" step="any" value="${rates[c]}"></div>`).join('')}</div><button class="primary" data-action="saveRates">Сохранить курсы</button></div>`}
function settings(){return `<h1 class="pageTitle">Настройки</h1><p class="muted">Управление приложением и данными</p><button class="settingsButton" data-go="currencies"><span>💱 Валюты и курсы<small>Основная валюта: ${base}</small></span><b>›</b></button><button class="settingsButton" data-go="accounts"><span>💳 Счета и баланс<small>Расчётные остатки по счетам</small></span><b>›</b></button><button class="settingsButton" data-go="budgets"><span>🎯 Бюджеты<small>Лимиты расходов по разделам</small></span><b>›</b></button><button class="settingsButton" data-action="backup"><span>💾 Резервная копия<small>Скачать JSON с операциями и настройками</small></span><b>↓</b></button><button class="settingsButton" data-action="restore"><span>♻️ Восстановить данные<small>Импорт из резервной копии JSON</small></span><b>›</b></button><button class="settingsButton" data-action="export"><span>📊 Экспорт CSV<small>Таблица всех операций</small></span><b>↓</b></button><button class="settingsButton" data-action="import"><span>📥 Импорт CSV<small>Загрузка операций из таблицы</small></span><b>›</b></button><div class="notice">Данные пока хранятся только в браузере на этом устройстве. Google Диск и облачная синхронизация ещё не подключены. Регулярно скачивай резервные копии.</div>`}
function add(){let x=items.find(i=>i.id===editId)||{type:'expense',scope:scope==='all'?'personal':scope,amount:'',currency:base,date:now(),category:'Продукты',account:'Наличные',note:''};return `<button class="back" data-go="${editId?'transactions':'home'}">‹ Назад</button><h1 class="pageTitle">${editId?'Изменить операцию':'Новая операция'}</h1><form id="entryForm" class="card"><div class="formGrid"><div class="field"><label>Тип</label><select name="type">${opt([['expense','Расход'],['income','Доход'],['transfer','Перевод']],x.type)}</select></div><div class="field"><label>Раздел</label><select name="scope">${scopeOpts(x.scope)}</select></div><div class="field"><label>Сумма</label><input name="amount" type="number" min="0.01" step="0.01" required value="${escapeHTML(x.amount)}" placeholder="0,00"></div><div class="field"><label>Валюта</label><select name="currency">${currOpts(x.currency||base)}</select></div><div class="field"><label>Дата</label><input name="date" type="date" required value="${escapeHTML(x.date)}"></div><div class="field"><label>Категория</label><input name="category" list="cats" required value="${escapeHTML(x.category)}"><datalist id="cats">${['Продукты','Транспорт','Покупки','Кафе','Развлечения','Жильё','Коммунальные','Здоровье','Зарплата','Выручка','Услуги','Другое'].map(v=>`<option value="${v}">`).join('')}</datalist></div></div><div class="field"><label>Счёт или карта</label><input name="account" required value="${escapeHTML(x.account)}" placeholder="Наличные, карта..."></div><div class="field"><label>Комментарий</label><textarea name="note">${escapeHTML(x.note)}</textarea></div><div class="actions"><button type="button" class="secondary" data-action="voice">🎙 Голосом</button><button class="primary" type="submit">${editId?'Сохранить изменения':'Добавить операцию'}</button></div><p id="voiceStatus" class="muted small"></p></form>${editId?'<button class="danger" data-action="delete">Удалить операцию</button>':''}`}
function render(){let html={home,transactions,analytics,settings,accounts,currencies,budgets:budgetsView,add}[view];$('#view').innerHTML=html?html():home();document.querySelectorAll('#nav [data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===view));let s=$('#search');if(s)s.addEventListener('input',e=>{search=e.target.value;let pos=e.target.selectionStart;render();let next=$('#search');next.focus();next.setSelectionRange(pos,pos)});let f=$('#entryForm');if(f)f.addEventListener('submit',saveEntry);let bs=$('#budgetScope');if(bs)bs.onchange=()=>{scope=bs.value;render()};let bc=$('#baseCurrency');if(bc)bc.onchange=()=>{let prev=base,pivot=Number(rates[bc.value])||1;Object.keys(rates).forEach(c=>rates[c]=(Number(rates[c])||1)/pivot);base=bc.value;rates[base]=1;render()}}
function saveEntry(e){e.preventDefault();let fd=new FormData(e.target),a=Number(fd.get('amount'));if(!(a>0))return alert('Укажи сумму больше нуля');let x={id:editId||id(),type:fd.get('type'),scope:fd.get('scope'),amount:a,currency:fd.get('currency'),date:fd.get('date'),category:String(fd.get('category')||'').trim(),account:String(fd.get('account')||'').trim(),note:String(fd.get('note')||'').trim()};if(editId){let i=items.findIndex(z=>z.id===editId);if(i<0)return;items[i]=x}else items.push(x);editId=null;persist();setView('transactions')}
function download(content,name,type){let url=URL.createObjectURL(new Blob([content],{type}));let a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function backup(){download(JSON.stringify({app:'FinFlow',version:3,exportedAt:new Date().toISOString(),items,baseCurrency:base,rates,budgets},null,2),'finflow-backup-'+now()+'.json','application/json')}function exportCsv(){let rows=[['date','scope','type','amount','currency','category','account','note'],...items.map(x=>[x.date,x.scope,x.type,x.amount,x.currency||'RUB',x.category,x.account,x.note])];download('\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),'finflow-'+now()+'.csv','text/csv;charset=utf-8')}
function csvParse(s){let lines=[],row=[],cell='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){cell+='"';i++}else q=!q}else if((c===';'||c===',')&&!q){if(c===csvParse.delim){row.push(cell);cell=''}else cell+=c}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&s[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))lines.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))lines.push(row);return lines}
async function handleFile(f,kind){if(!f)return;try{let t=(await f.text()).replace(/^\ufeff/,'');if(kind==='restore'){let d=JSON.parse(t),arr=Array.isArray(d)?d:d.items;if(!Array.isArray(arr)||!arr.every(x=>x&&typeof x==='object'&&Number.isFinite(Number(x.amount))))throw Error('Неверный формат операций');if(!confirm('Заменить все текущие операции данными из копии?'))return;items=arr;if(d.baseCurrency&&CUR.includes(d.baseCurrency))base=d.baseCurrency;if(d.rates&&typeof d.rates==='object')rates={...defaults,...d.rates};if(d.budgets&&typeof d.budgets==='object')budgets=d.budgets;localStorage.setItem('finflow_base_currency',base);localStorage.setItem('finflow_rates',JSON.stringify(rates));localStorage.setItem('finflow_budgets',JSON.stringify(budgets));persist();alert('Данные восстановлены');setView('home')}else{let header=t.split(/\r?\n/,1)[0];csvParse.delim=(header.match(/;/g)||[]).length>=(header.match(/,/g)||[]).length?';':',';let rows=csvParse(t),head=rows.shift().map(v=>v.trim().toLowerCase());let get=(r,...n)=>{let i=head.findIndex(h=>n.includes(h));return i<0?'':r[i]||''};let added=[];for(let r of rows){let raw=get(r,'amount','сумма','sum').replace(/\s/g,'').replace(',','.');let a=Number(raw);if(!Number.isFinite(a)||a===0)continue;let type=get(r,'type','тип').toLowerCase();type=['income','expense','transfer'].includes(type)?type:/доход|income|поступлен/.test(type)?'income':'expense';let sc=get(r,'scope','раздел');if(!['personal','family','business'].includes(sc))sc='personal';let date=get(r,'date','дата')||now();if(!/^\d{4}-\d{2}-\d{2}$/.test(date))date=now();let c=get(r,'currency','валюта').toUpperCase()||'RUB';if(!CUR.includes(c))c='RUB';added.push({id:id(),type,scope:sc,amount:Math.abs(a),currency:c,date,category:get(r,'category','категория')||'Импорт',account:get(r,'account','счёт','счет')||'Импорт CSV',note:get(r,'note','комментарий','описание')})}if(!added.length)throw Error('Нет распознанных операций');if(!confirm(`Импортировать ${added.length} операций? Проверь данные после загрузки.`))return;items.push(...added);persist();alert('Импортировано: '+added.length);setView('transactions')}}catch(e){alert('Ошибка загрузки: '+e.message)}}
function voice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition,el=$('#voiceStatus');if(!SR){el.textContent='Голосовой ввод не поддерживается этим браузером';return}let r=new SR();r.lang='ru-RU';r.onstart=()=>el.textContent='Слушаю…';r.onerror=()=>el.textContent='Не удалось распознать речь';r.onresult=e=>{let t=e.results[0][0].transcript,n=t.match(/\d[\d\s]*(?:[,.]\d{1,2})?/);if(n)$('[name="amount"]').value=n[0].replace(/\s/g,'').replace(',','.');$('[name="note"]').value=t;$('[name="type"]').value=/доход|зарплат|получил|выручк/i.test(t)?'income':'expense';el.textContent='Распознано: '+t+'. Проверь поля и сохрани.'};r.start()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-go],[data-scope],[data-type],[data-edit],[data-category],[data-account],[data-clear-category],[data-action]');if(!b)return;if(b.dataset.go){if(b.dataset.go==='add')editId=null;setView(b.dataset.go)}else if(b.dataset.scope){scope=b.dataset.scope;setView(view==='analytics'?'analytics':'home')}else if(b.dataset.type){filterType=b.dataset.type;drillCategory=null;setView('transactions')}else if(b.dataset.edit){editId=b.dataset.edit;setView('add')}else if(b.dataset.category){drillCategory=decodeURIComponent(b.dataset.category);filterType='expense';setView('transactions')}else if(b.dataset.account){search=decodeURIComponent(b.dataset.account);setView('transactions')}else if(b.hasAttribute('data-clear-category')){drillCategory=null;render()}else if(b.dataset.action){let a=b.dataset.action;if(a==='backup')backup();if(a==='export')exportCsv();if(a==='restore'||a==='import'){let picker=$('#filePicker');picker.value='';picker.accept=a==='restore'?'.json,application/json':'.csv,text/csv';picker.onchange=()=>handleFile(picker.files[0],a);picker.click()}if(a==='delete'&&editId&&confirm('Удалить операцию?')){items=items.filter(x=>x.id!==editId);editId=null;persist();setView('transactions')}if(a==='voice')voice();if(a==='saveBudget'){let k=$('#budgetScope').value,v=Number($('#budgetLimit').value);if(v<0||!Number.isFinite(v))return alert('Неверный лимит');budgets[k]=v;localStorage.setItem('finflow_budgets',JSON.stringify(budgets));alert('Лимит сохранён');render()}if(a==='saveRates'){document.querySelectorAll('[data-rate]').forEach(i=>{let v=Number(i.value);if(v>0)rates[i.dataset.rate]=v});rates[base]=1;localStorage.setItem('finflow_base_currency',base);localStorage.setItem('finflow_rates',JSON.stringify(rates));alert('Курсы сохранены');setView('settings')}}});render();
</script></body></html>
