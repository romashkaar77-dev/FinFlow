/* 3.1 Plus: screens, analytics and functionality; original 3.1 palette retained */
.trendChart{height:154px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding:10px 2px 0}

</style></head><body><main class="app"><header class="head"><div><div class="brand">FIN<span>FLOW</span><span class="brandMark"> / TITANIUM</span></div><div class="sub">Ваш финансовый контроль</div></div><div class="headActions"><button class="circle" data-go="transactions" aria-label="Поиск">⌕</button><button class="circle" data-go="settings" aria-label="Настройки">⚙</button></div></header><div id="view"></div></main><nav class="nav" id="nav"><button data-go="home" class="" aria-label="Главная"><span class="dockIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></span><span class="dockLabel">Главная</span></button><button data-go="transactions" class="" aria-label="Операции"><span class="dockIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg></span><span class="dockLabel">Операции</span></button><button data-go="add" class="plus" aria-label="Добавить"><span class="dockIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="dockLabel">Добавить</span></button><button data-go="analytics" class="" aria-label="Аналитика"><span class="dockIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18M7 16v-4M12 16V7M17 16v-7"/></svg></span><span class="dockLabel">Аналитика</span></button><button data-go="settings" class="" aria-label="Настройки"><span class="dockIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.86 1.86-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1 1.56V21h-2.63v-.09a1.7 1.7 0 0 0-1-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-1.86-1.86.06-.06A1.7 1.7 0 0 0 7.97 15a1.7 1.7 0 0 0-1.56-1H6v-2.63h.41a1.7 1.7 0 0 0 1.56-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.86-1.86.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1-1.56V5h2.63v.41a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.86 1.86-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1H21V14h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg></span><span class="dockLabel">Настройки</span></button></nav><input type="file" id="filePicker" accept=".json,.csv,text/csv,application/json" hidden><script>
'use strict';const KEY='finflow_v2',OLD='finflow_v1',CUR=['RUB','USD','EUR','CNY','GEL','AED','TRY','GBP','KZT','BYN'];const defaults={RUB:1,EUR:100,USD:92,CNY:12.7,GEL:34,AED:25,TRY:2.8,GBP:118,KZT:.2,BYN:28};const $=s=>document.querySelector(s);const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const now=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};let items=[];try{let a=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD)||'[]');items=Array.isArray(a)?a:[]}catch{}let base=localStorage.getItem('finflow_base_currency')||'RUB';if(!CUR.includes(base))base='RUB';let rates={...defaults};try{rates={...rates,...JSON.parse(localStorage.getItem('finflow_rates')||'{}')}}catch{}let scope='all',view='home',filterType='all',search='',editId=null,drillCategory=null;let accountMeta={};try{accountMeta=JSON.parse(localStorage.getItem('finflow_accounts')||'{}')||{}}catch{}
let goals=[];try{goals=JSON.parse(localStorage.getItem('finflow_goals')||'[]')||[]}catch{}
let customCategories=[];try{customCategories=JSON.parse(localStorage.getItem('finflow_categories')||'[]')||[]}catch{}
let budgets={};try{budgets=JSON.parse(localStorage.getItem('finflow_budgets')||'{}')||{}}catch{};const names={all:'Общий обзор',personal:'Личные',family:'Семья',business:'Бизнес'},colors=['#2586ff','#fa3597','#ffb44b','#26db9d','#af59ff','#17b6e5','#fb647b'];const fmt=(n,c=base)=>{try{return new Intl.NumberFormat('ru-RU',{style:'currency',currency:c,maximumFractionDigits:2}).format(Number(n)||0)}catch{return (Number(n)||0).toFixed(2)+' '+c}};const conv=x=>(Number(x.amount)||0)*(Number(rates[x.currency||'RUB'])||1);const match=x=>scope==='all'||x.scope===scope;const month=()=>now().slice(0,7);const total=(arr,t)=>arr.filter(x=>x.type===t).reduce((s,x)=>s+conv(x),0);const data=()=>items.filter(match);const mdata=()=>data().filter(x=>String(x.date||'').startsWith(month()));const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);const opt=(arr,v)=>arr.map(([k,l])=>`<option value="${escapeHTML(k)}" ${k===v?'selected':''}>${escapeHTML(l)}</option>`).join('');const currOpts=v=>opt(CUR.map(c=>[c,c]),v);const scopeOpts=v=>opt(Object.entries(names).filter(([k])=>k!=='all'),v);const panel=(title,body,extra='')=>`<section class="card"><div class="sectionHead"><h2>${title}</h2>${extra}</div>${body}</section>`;function persist(){localStorage.setItem(KEY,JSON.stringify(items));render()}function setView(v){view=v;window.scrollTo(0,0);render()}function chartData(){let cats={};mdata().filter(x=>x.type==='expense').forEach(x=>cats[x.category||'Другое']=(cats[x.category||'Другое']||0)+conv(x));return Object.entries(cats).sort((a,b)=>b[1]-a[1])}function pie(){let arr=chartData(),sum=arr.reduce((s,x)=>s+x[1],0);if(!sum)return `<div class="empty">Расходов за этот месяц пока нет. Нажми +, чтобы добавить первую операцию.</div>`;let cursor=0,grad=arr.map((x,i)=>{let a=cursor;cursor+=x[1]/sum*100;return `${colors[i%colors.length]} ${a}% ${cursor}%`}).join(',');return `<div class="donutrow"><div class="donut" style="background:conic-gradient(${grad})"><div class="hole">${fmt(sum)}<span class="small muted">Всего</span></div></div><div class="legend">${arr.map((x,i)=>`<button class="transaction" style="padding:8px;margin:4px 0" data-category="${encodeURIComponent(x[0])}"><span class="details"><span class="dot" style="background:${colors[i%colors.length]}"></span>${escapeHTML(x[0])}</span><strong>${Math.round(x[1]/sum*100)}%</strong></button>`).join('')}</div></div>`}function txRow(x){let neg=x.type==='expense';return `<button class="transaction" data-edit="${escapeHTML(x.id)}"><span class="emoji">${x.type==='income'?'💰':x.type==='transfer'?'🔄':'🧾'}</span><span class="details"><strong>${escapeHTML(x.category||'Без категории')}</strong><span class="small muted">${escapeHTML(x.date||'')} · ${escapeHTML(x.account||'Счёт')}</span></span><span class="amount ${neg?'red':x.type==='income'?'green':''}">${neg?'−':x.type==='income'?'+':''}${fmt(x.amount,x.currency||'RUB')}</span><span class="muted">›</span></button>`}function trendChart(){let months=[];for(let i=5;i>=0;i--){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);let k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');let rows=data().filter(x=>String(x.date||'').startsWith(k));months.push({name:d.toLocaleDateString('ru-RU',{month:'short'}),inc:total(rows,'income'),exp:total(rows,'expense')})}let max=Math.max(1,...months.flatMap(m=>[m.inc,m.exp]));return '<div class="trendChart">'+months.map(m=>'<div class="trendMonth"><div class="trendBars"><div class="trendBar in" style="height:'+Math.max(3,Math.round(m.inc/max*100))+'%" title="Доходы '+escapeHTML(fmt(m.inc))+'"></div><div class="trendBar out" style="height:'+Math.max(3,Math.round(m.exp/max*100))+'%" title="Расходы '+escapeHTML(fmt(m.exp))+'"></div></div><span>'+escapeHTML(m.name)+'</span></div>').join('')+'</div><div class="trendLegend"><span>● Доходы</span><span>● Расходы</span></div>'}
function budgetSummary(){let groups=Object.entries(names).filter(([k])=>k!=='all'&&(scope==='all'||scope===k));return groups.map(([k,n])=>{let limit=Number(budgets[k]||0),spent=total(items.filter(x=>x.scope===k&&String(x.date||'').startsWith(month())),'expense'),pct=limit?Math.min(100,Math.round(spent/limit*100)):0;return '<button class="budgetItem" data-go="budgets"><div class="budgetTop"><strong>'+escapeHTML(n)+'</strong><span>'+escapeHTML(fmt(spent))+' / '+(limit?escapeHTML(fmt(limit)):'не задан')+'</span></div><div class="budgetTrack"><div style="width:'+pct+'%;background:'+(spent>limit&&limit?'#FF829D':'#53E6AE')+'"></div></div></button>'}).join('')}
function home(){let a=mdata(),all=data(),inc=total(a,'income'),exp=total(a,'expense'),bal=total(all,'income')-total(all,'expense');return `<div class="homeTop"><div><div class="overline">ВАШ ФИНАНСОВЫЙ ОБЗОР</div><h1 class="homeTitle">Мои финансы<span class="titleDot">.</span></h1></div><button class="topSettings" data-go="settings" aria-label="Настройки">⚙</button></div><div class="tabs">${Object.entries(names).map(([k,v])=>`<button data-scope="${k}" class="${scope===k?'active':''}">${v}</button>`).join('')}</div><button class="hero" data-go="accounts"><div class="heroTop"><span>ОБЩИЙ БАЛАНС</span><span class="heroArrow">↗</span></div><div class="heroNumber">${fmt(bal)}</div><div class="heroBottom"><span><span class="statusDot"></span> Все счета и активы</span><span class="heroCurrency">${base}　›</span></div></button><div class="overviewHeading"><h2>Этот месяц</h2><button data-go="analytics">Вся аналитика　↗</button></div><div class="metrics"><button class="metric" data-type="income"><div class="metricIcon positive">↙</div><div class="metricLabel">Доходы</div><div class="metricValue">${fmt(inc)}</div><div class="metricFoot">Поступления за месяц</div></button><button class="metric" data-type="expense"><div class="metricIcon negative">↗</div><div class="metricLabel">Расходы</div><div class="metricValue">${fmt(exp)}</div><div class="metricFoot">Списания за месяц</div></button></div><button class="netStrip" data-go="analytics"><span><span class="netGlyph">◈</span> Финансовый результат</span><strong>${fmt(inc-exp)}</strong><span class="chev">›</span></button><div class="overviewHeading"><h2>Быстрые действия</h2></div><div class="quickGrid"><button data-go="add"><span class="quickIcon">＋</span><span>Добавить</span></button><button data-action="newTransfer"><span class="quickIcon">⇄</span><span>Переводы</span></button><button data-go="accounts"><span class="quickIcon">▤</span><span>Счета</span></button><button data-go="currencies"><span class="quickIcon">◎</span><span>Валюты</span></button></div>${panel('Динамика за 6 месяцев',trendChart(),'<button class="link" data-go="analytics">Анализ ↗</button>')}${panel('Бюджеты',budgetSummary(),'<button class="link" data-go="budgets">Настроить ↗</button>')}${panel('Структура расходов',pie(),'<button class="link" data-go="analytics">Подробнее ↗</button>')}${panel('Последние операции',all.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,5).map(txRow).join('')||'<div class="empty">Операций пока нет</div>','<button class="link" data-go="transactions">Все операции ↗</button>')}<div class="actions"><button class="secondary" data-action="export">↓ Экспорт CSV</button><button class="secondary" data-action="backup">⇩ Резервная копия</button></div>`}function transactions(){let list=data().filter(x=>(filterType==='all'||x.type===filterType)&&(!drillCategory||x.category===drillCategory)&&(!search||[x.category,x.account,x.toAccount,x.note,x.date,x.currency].join(' ').toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));return `<h1 class="pageTitle">Операции</h1><p class="muted">Нажми на операцию, чтобы изменить или удалить её.</p><div class="field"><input id="search" placeholder="Поиск по операциям" value="${escapeHTML(search)}"></div><div class="chipbar">${[['all','Все'],['income','Доходы'],['expense','Расходы'],['transfer','Переводы']].map(([k,v])=>`<button class="chip ${filterType===k?'active':''}" data-type="${k}">${v}</button>`).join('')}</div>${drillCategory?`<div class="notice">Категория: ${escapeHTML(drillCategory)} <button class="link" data-clear-category>Сбросить</button></div>`:''}${list.map(txRow).join('')||'<div class="card empty">По выбранным условиям операций нет</div>'}<button class="primary" style="width:100%" data-go="add">+ Добавить операцию</button>`}function analytics(){let a=mdata(),inc=total(a,'income'),exp=total(a,'expense');return `<h1 class="pageTitle">Аналитика</h1><p class="muted">${month()} · ${names[scope]}</p><div class="stats"><button class="card stat income tap" data-type="income"><div class="label">Доходы</div><div class="number green">${fmt(inc)}</div></button><button class="card stat expense tap" data-type="expense"><div class="label">Расходы</div><div class="number red">${fmt(exp)}</div></button><button class="card stat net tap" data-go="budgets"><div class="label">Разница</div><div class="number blue">${fmt(inc-exp)}</div></button></div>${panel('Динамика за 6 месяцев',trendChart())}${panel('Расходы по категориям',pie())}${panel('Финансовые цели и лимиты',`<p class="muted">Задавай месячный лимит расходов для каждого раздела.</p><button class="primary" data-go="budgets">Открыть бюджеты ›</button>`)}${panel('По разделам',Object.entries(names).filter(([k])=>k!=='all').map(([k,v])=>{let a=items.filter(x=>x.scope===k&&String(x.date||'').startsWith(month()));return `<button class="settingsButton" data-scope="${k}"><span>${v}<small>Доходы ${fmt(total(a,'income'))} · Расходы ${fmt(total(a,'expense'))}</small></span><b>›</b></button>`}).join(''))}`}
function accountBalances(){let by={};for(let [name,meta] of Object.entries(accountMeta)){by[name]=Number(meta.opening||0)*(Number(rates[meta.currency||base])||1)}data().forEach(x=>{let n=x.account||'Без счёта';by[n]=(by[n]||0)+(x.type==='income'?conv(x):x.type==='expense'?-conv(x):x.type==='transfer'&&x.toAccount?-conv(x):0);if(x.type==='transfer'&&x.toAccount)by[x.toAccount]=(by[x.toAccount]||0)+conv(x)});return by}
function accounts(){let by=accountBalances(),bal=Object.values(by).reduce((a,b)=>a+b,0);return `<button class="back" data-go="home">‹ На главную</button><h1 class="pageTitle">Счета и баланс</h1><div class="card balance"><div class="eyebrow">Общий баланс в ${base}</div><div class="big">${fmt(bal)}</div><p class="muted">С учётом заданных начальных остатков</p></div>${panel('Мои счета',Object.entries(by).map(([k,v])=>`<button class="settingsButton" data-account="${encodeURIComponent(k)}"><span>${escapeHTML(k)}<small>${accountMeta[k]?'Начальный остаток: '+fmt(Number(accountMeta[k].opening||0)*(Number(rates[accountMeta[k].currency||base])||1)):'Без начального остатка'}</small></span><b>${fmt(v)} ›</b></button>`).join('')||'<div class="empty">Счетов пока нет</div>')}<div class="card"><h2>Добавить или изменить счёт</h2><form id="accountForm"><div class="field"><label>Название</label><input name="name" required placeholder="Например, Сбербанк"></div><div class="field"><label>Начальный остаток</label><input name="opening" type="number" step="0.01" value="0"></div><div class="field"><label>Валюта счёта</label><select name="currency">${currOpts(base)}</select></div><button class="primary" type="submit">Сохранить счёт</button></form></div>${panel('Валюты',`<button class="primary" data-go="currencies">Настроить валюты ›</button>`)}`}
function goalsView(){return `<button class="back" data-go="home">‹ На главную</button><h1 class="pageTitle">Финансовые цели</h1>${goals.map(g=>{let pct=Math.min(100,Math.round(100*Number(g.saved||0)/Math.max(1,Number(g.target))));return `<div class="card"><div class="sectionHead"><h2>${escapeHTML(g.name)}</h2><button class="link" data-goal-delete="${escapeHTML(g.id)}">Удалить</button></div><div class="miniRow"><span>Накоплено</span><strong>${fmt(g.saved)}</strong></div><div class="miniRow"><span>Цель</span><strong>${fmt(g.target)}</strong></div><div class="budgetTrack"><div style="width:${pct}%;background:#53E6AE"></div></div><form data-goal-add="${escapeHTML(g.id)}" class="actions"><input type="number" min="0.01" step="0.01" name="amount" placeholder="Пополнить цель" required><button class="primary" type="submit">Пополнить</button></form><p class="muted small">Цель — отдельный план накоплений; пополнение не создаёт финансовую операцию.</p></div>`}).join('')||'<div class="card empty">Создай первую финансовую цель</div>'}<div class="card"><h2>Новая цель</h2><form id="goalForm"><div class="field"><label>Название</label><input name="name" required placeholder="Отпуск, автомобиль..."></div><div class="field"><label>Нужная сумма в ${base}</label><input name="target" type="number" min="0.01" step="0.01" required></div><button class="primary" type="submit">Создать цель</button></form></div>`}
function categoriesView(){return `<button class="back" data-go="settings">‹ Настройки</button><h1 class="pageTitle">Категории</h1>${panel('Мои категории',customCategories.map(c=>`<div class="miniRow"><strong>${escapeHTML(c)}</strong><button class="link" data-cat-delete="${encodeURIComponent(c)}">Удалить</button></div>`).join('')||'<div class="empty">Пользовательских категорий пока нет</div>')}<div class="card"><form id="categoryForm"><div class="field"><label>Название категории</label><input name="name" required maxlength="45" placeholder="Например, Автомобиль"></div><button class="primary" type="submit">Добавить категорию</button></form></div>`}
function budgetsView(){let k=scope==='all'?'personal':scope;let limit=Number(budgets[k]||0),spent=total(items.filter(x=>x.scope===k&&String(x.date||'').startsWith(month())),'expense');return `<button class="back" data-go="analytics">‹ Аналитика</button><h1 class="pageTitle">Бюджеты</h1><p class="muted">Лимит расходов за текущий месяц</p><div class="card"><div class="field"><label>Раздел</label><select id="budgetScope">${scopeOpts(k)}</select></div><div class="field"><label>Лимит в ${base}</label><input id="budgetLimit" type="number" min="0" step="0.01" value="${limit}"></div><div class="miniRow"><span>Потрачено</span><strong class="red">${fmt(spent)}</strong></div><div class="miniRow"><span>Осталось</span><strong class="${limit-spent>=0?'green':'red'}">${limit?fmt(limit-spent):'Лимит не задан'}</strong></div><button class="primary" data-action="saveBudget">Сохранить лимит</button></div>`}
function currencies(){return `<button class="back" data-go="settings">‹ Настройки</button><h1 class="pageTitle">Валюты и курсы</h1><div class="notice">Курсы вводятся вручную и могут отличаться от банковских. Изменение валюты пересчитает отчёты, но не изменит суммы операций.</div><div class="card"><div class="field"><label>Основная валюта отчётов</label><select id="baseCurrency">${currOpts(base)}</select></div><div id="rateFields">${CUR.filter(c=>c!==base).map(c=>`<div class="field"><label>1 ${c} = сколько ${base}?</label><input data-rate="${c}" type="number" min="0.000001" step="any" value="${rates[c]}"></div>`).join('')}</div><button class="primary" data-action="saveRates">Сохранить курсы</button></div>`}
function settings(){return `<h1 class="pageTitle">Настройки</h1><p class="muted">Управление приложением и данными</p><button class="settingsButton" data-go="currencies"><span>💱 Валюты и курсы<small>Основная валюта: ${base}</small></span><b>›</b></button><button class="settingsButton" data-go="accounts"><span>💳 Счета и баланс<small>Расчётные остатки по счетам</small></span><b>›</b></button><button class="settingsButton" data-go="goals"><span>🏆 Финансовые цели<small>Планирование накоплений</small></span><b>›</b></button><button class="settingsButton" data-go="categories"><span>🗂️ Категории<small>Добавить свои категории расходов</small></span><b>›</b></button><button class="settingsButton" data-go="budgets"><span>🎯 Бюджеты<small>Лимиты расходов по разделам</small></span><b>›</b></button><button class="settingsButton" data-action="backup"><span>💾 Резервная копия<small>Скачать JSON с операциями и настройками</small></span><b>↓</b></button><button class="settingsButton" data-action="restore"><span>♻️ Восстановить данные<small>Импорт из резервной копии JSON</small></span><b>›</b></button><button class="settingsButton" data-action="export"><span>📊 Экспорт CSV<small>Таблица всех операций</small></span><b>↓</b></button><button class="settingsButton" data-action="import"><span>📥 Импорт CSV<small>Загрузка операций из таблицы</small></span><b>›</b></button><div class="notice">Данные пока хранятся только в браузере на этом устройстве. Google Диск и облачная синхронизация ещё не подключены. Регулярно скачивай резервные копии.</div>`}
function add(){let x=items.find(i=>i.id===editId)||{type:'expense',scope:scope==='all'?'personal':scope,amount:'',currency:base,date:now(),category:'Продукты',account:'Наличные',note:''};return `<button class="back" data-go="${editId?'transactions':'home'}">‹ Назад</button><h1 class="pageTitle">${editId?'Изменить операцию':'Новая операция'}</h1><form id="entryForm" class="card"><div class="formGrid"><div class="field"><label>Тип</label><select name="type">${opt([['expense','Расход'],['income','Доход'],['transfer','Перевод']],x.type)}</select></div><div class="field"><label>Раздел</label><select name="scope">${scopeOpts(x.scope)}</select></div><div class="field"><label>Сумма</label><input name="amount" type="number" min="0.01" step="0.01" required value="${escapeHTML(x.amount)}" placeholder="0,00"></div><div class="field"><label>Валюта</label><select name="currency">${currOpts(x.currency||base)}</select></div><div class="field"><label>Дата</label><input name="date" type="date" required value="${escapeHTML(x.date)}"></div><div class="field"><label>Категория</label><input name="category" list="cats" required value="${escapeHTML(x.category)}"><datalist id="cats">${[...new Set(['Продукты','Транспорт','Покупки','Кафе','Развлечения','Жильё','Коммунальные','Здоровье','Зарплата','Выручка','Услуги','Другое',...customCategories])].map(v=>`<option value="${v}">`).join('')}</datalist></div></div><div class="field"><label>Счёт или карта</label><input name="account" required value="${escapeHTML(x.account)}" placeholder="Наличные, карта..."></div><div class="field transferDestination" id="transferDestination"><label>Счёт получателя (для перевода)</label><input name="toAccount" value="${escapeHTML(x.toAccount||'')}" placeholder="Например, накопительный счёт"></div><div class="field"><label>Комментарий</label><textarea name="note">${escapeHTML(x.note)}</textarea></div><div class="actions"><button type="button" class="secondary" data-action="voice">🎙 Голосом</button><button class="primary" type="submit">${editId?'Сохранить изменения':'Добавить операцию'}</button></div><p id="voiceStatus" class="muted small"></p></form>${editId?'<button class="danger" data-action="delete">Удалить операцию</button>':''}`}
function render(){let html={home,transactions,analytics,settings,accounts,goals:goalsView,categories:categoriesView,currencies,budgets:budgetsView,add}[view];$('#view').innerHTML=html?html():home();document.querySelectorAll('#nav [data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===view));let s=$('#search');if(s)s.addEventListener('input',e=>{search=e.target.value;let pos=e.target.selectionStart;render();let next=$('#search');next.focus();next.setSelectionRange(pos,pos)});let f=$('#entryForm');if(f){f.addEventListener('submit',saveEntry);let t=f.querySelector('[name="type"]');if(t)t.addEventListener('change',toggleTransfer);toggleTransfer()}let af=$('#accountForm');if(af)af.onsubmit=e=>{e.preventDefault();let f=new FormData(af),name=String(f.get('name')||'').trim(),opening=Number(f.get('opening'));if(!name||!Number.isFinite(opening))return alert('Проверь данные счёта');if(accountMeta[name]&&!confirm('Обновить начальный остаток счёта?'))return;accountMeta[name]={opening,currency:f.get('currency')};localStorage.setItem('finflow_accounts',JSON.stringify(accountMeta));render()};
let gf=$('#goalForm');if(gf)gf.onsubmit=e=>{e.preventDefault();let f=new FormData(gf),name=String(f.get('name')||'').trim(),target=Number(f.get('target'));if(!name||!(target>0))return;goals.push({id:id(),name,target,saved:0});localStorage.setItem('finflow_goals',JSON.stringify(goals));render()};
document.querySelectorAll('[data-goal-add]').forEach(f=>f.onsubmit=e=>{e.preventDefault();let g=goals.find(x=>x.id===f.dataset.goalAdd),a=Number(new FormData(f).get('amount'));if(g&&a>0){g.saved=Number(g.saved||0)+a;localStorage.setItem('finflow_goals',JSON.stringify(goals));render()}});
let cf=$('#categoryForm');if(cf)cf.onsubmit=e=>{e.preventDefault();let n=String(new FormData(cf).get('name')||'').trim();if(n&&!customCategories.includes(n)){customCategories.push(n);localStorage.setItem('finflow_categories',JSON.stringify(customCategories));render()}};
let bs=$('#budgetScope');if(bs)bs.onchange=()=>{scope=bs.value;render()};let bc=$('#baseCurrency');if(bc)bc.onchange=()=>{let prev=base,pivot=Number(rates[bc.value])||1;Object.keys(rates).forEach(c=>rates[c]=(Number(rates[c])||1)/pivot);base=bc.value;rates[base]=1;render()}}
function toggleTransfer(){let f=$('#entryForm');if(!f)return;let transfer=f.querySelector('[name="type"]')?.value==='transfer';let dest=f.querySelector('#transferDestination');if(dest){dest.hidden=!transfer;dest.querySelector('input').required=transfer}}function saveEntry(e){e.preventDefault();let fd=new FormData(e.target),a=Number(fd.get('amount'));if(!(a>0))return alert('Укажи сумму больше нуля');if(fd.get('type')==='transfer'&&(!String(fd.get('toAccount')||'').trim()||String(fd.get('toAccount')).trim()===String(fd.get('account')).trim()))return alert('Укажи другой счёт получателя');let x={id:editId||id(),type:fd.get('type'),scope:fd.get('scope'),amount:a,currency:fd.get('currency'),date:fd.get('date'),category:String(fd.get('category')||'').trim(),account:String(fd.get('account')||'').trim(),toAccount:String(fd.get('toAccount')||'').trim(),note:String(fd.get('note')||'').trim()};if(editId){let i=items.findIndex(z=>z.id===editId);if(i<0)return;items[i]=x}else items.push(x);editId=null;persist();setView('transactions')}
function download(content,name,type){let url=URL.createObjectURL(new Blob([content],{type}));let a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function backup(){download(JSON.stringify({app:'FinFlow',version:4,exportedAt:new Date().toISOString(),items,baseCurrency:base,rates,budgets,accountMeta,goals,customCategories},null,2),'finflow-backup-'+now()+'.json','application/json')}function exportCsv(){let rows=[['date','scope','type','amount','currency','category','account','note','toAccount'],...items.map(x=>[x.date,x.scope,x.type,x.amount,x.currency||'RUB',x.category,x.account,x.note,x.toAccount||''])];download('\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),'finflow-'+now()+'.csv','text/csv;charset=utf-8')}
function csvParse(s){let lines=[],row=[],cell='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){cell+='"';i++}else q=!q}else if((c===';'||c===',')&&!q){if(c===csvParse.delim){row.push(cell);cell=''}else cell+=c}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&s[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))lines.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))lines.push(row);return lines}
async function handleFile(f,kind){if(!f)return;try{let t=(await f.text()).replace(/^\ufeff/,'');if(kind==='restore'){let d=JSON.parse(t),arr=Array.isArray(d)?d:d.items;if(!Array.isArray(arr)||!arr.every(x=>x&&typeof x==='object'&&Number.isFinite(Number(x.amount))))throw Error('Неверный формат операций');if(!confirm('Заменить все текущие операции данными из копии?'))return;items=arr;if(d.baseCurrency&&CUR.includes(d.baseCurrency))base=d.baseCurrency;if(d.rates&&typeof d.rates==='object')rates={...defaults,...d.rates};if(d.budgets&&typeof d.budgets==='object')budgets=d.budgets;if(d.accountMeta&&typeof d.accountMeta==='object')accountMeta=d.accountMeta;if(Array.isArray(d.goals))goals=d.goals;if(Array.isArray(d.customCategories))customCategories=d.customCategories;localStorage.setItem('finflow_accounts',JSON.stringify(accountMeta));localStorage.setItem('finflow_goals',JSON.stringify(goals));localStorage.setItem('finflow_categories',JSON.stringify(customCategories));localStorage.setItem('finflow_base_currency',base);localStorage.setItem('finflow_rates',JSON.stringify(rates));localStorage.setItem('finflow_budgets',JSON.stringify(budgets));persist();alert('Данные восстановлены');setView('home')}else{let header=t.split(/\r?\n/,1)[0];csvParse.delim=(header.match(/;/g)||[]).length>=(header.match(/,/g)||[]).length?';':',';let rows=csvParse(t),head=rows.shift().map(v=>v.trim().toLowerCase());let get=(r,...n)=>{let i=head.findIndex(h=>n.includes(h));return i<0?'':r[i]||''};let added=[];for(let r of rows){let raw=get(r,'amount','сумма','sum').replace(/\s/g,'').replace(',','.');let a=Number(raw);if(!Number.isFinite(a)||a===0)continue;let type=get(r,'type','тип').toLowerCase();type=['income','expense','transfer'].includes(type)?type:/доход|income|поступлен/.test(type)?'income':'expense';let sc=get(r,'scope','раздел');if(!['personal','family','business'].includes(sc))sc='personal';let date=get(r,'date','дата')||now();if(!/^\d{4}-\d{2}-\d{2}$/.test(date))date=now();let c=get(r,'currency','валюта').toUpperCase()||'RUB';if(!CUR.includes(c))c='RUB';added.push({id:id(),type,scope:sc,amount:Math.abs(a),currency:c,date,category:get(r,'category','категория')||'Импорт',account:get(r,'account','счёт','счет')||'Импорт CSV',toAccount:get(r,'toaccount','счёт получателя','счет получателя'),note:get(r,'note','комментарий','описание')})}if(!added.length)throw Error('Нет распознанных операций');if(!confirm(`Импортировать ${added.length} операций? Проверь данные после загрузки.`))return;items.push(...added);persist();alert('Импортировано: '+added.length);setView('transactions')}}catch(e){alert('Ошибка загрузки: '+e.message)}}
function voice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition,el=$('#voiceStatus');if(!SR){el.textContent='Голосовой ввод не поддерживается этим браузером';return}let r=new SR();r.lang='ru-RU';r.onstart=()=>el.textContent='Слушаю…';r.onerror=()=>el.textContent='Не удалось распознать речь';r.onresult=e=>{let t=e.results[0][0].transcript,n=t.match(/\d[\d\s]*(?:[,.]\d{1,2})?/);if(n)$('[name="amount"]').value=n[0].replace(/\s/g,'').replace(',','.');$('[name="note"]').value=t;$('[name="type"]').value=/доход|зарплат|получил|выручк/i.test(t)?'income':'expense';el.textContent='Распознано: '+t+'. Проверь поля и сохрани.'};r.start()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-go],[data-scope],[data-type],[data-edit],[data-category],[data-account],[data-clear-category],[data-action],[data-goal-delete],[data-cat-delete]');if(!b)return;if(b.dataset.goalDelete){if(confirm('Удалить финансовую цель?')){goals=goals.filter(g=>g.id!==b.dataset.goalDelete);localStorage.setItem('finflow_goals',JSON.stringify(goals));render()}return}if(b.dataset.catDelete){let c=decodeURIComponent(b.dataset.catDelete);if(confirm('Удалить категорию из списка? Существующие операции сохранятся.')){customCategories=customCategories.filter(x=>x!==c);localStorage.setItem('finflow_categories',JSON.stringify(customCategories));render()}return}if(b.dataset.go){if(b.dataset.go==='add')editId=null;setView(b.dataset.go)}else if(b.dataset.scope){scope=b.dataset.scope;setView(view==='analytics'?'analytics':'home')}else if(b.dataset.type){filterType=b.dataset.type;drillCategory=null;setView('transactions')}else if(b.dataset.edit){editId=b.dataset.edit;setView('add')}else if(b.dataset.category){drillCategory=decodeURIComponent(b.dataset.category);filterType='expense';setView('transactions')}else if(b.dataset.account){search=decodeURIComponent(b.dataset.account);setView('transactions')}else if(b.hasAttribute('data-clear-category')){drillCategory=null;render()}else if(b.dataset.action){let a=b.dataset.action;if(a==='newTransfer'){editId=null;setView('add');let type=$('[name="type"]');if(type){type.value='transfer';toggleTransfer()}}if(a==='backup')backup();if(a==='export')exportCsv();if(a==='restore'||a==='import'){let picker=$('#filePicker');picker.value='';picker.accept=a==='restore'?'.json,application/json':'.csv,text/csv';picker.onchange=()=>handleFile(picker.files[0],a);picker.click()}if(a==='delete'&&editId&&confirm('Удалить операцию?')){items=items.filter(x=>x.id!==editId);editId=null;persist();setView('transactions')}if(a==='voice')voice();if(a==='saveBudget'){let k=$('#budgetScope').value,v=Number($('#budgetLimit').value);if(v<0||!Number.isFinite(v))return alert('Неверный лимит');budgets[k]=v;localStorage.setItem('finflow_budgets',JSON.stringify(budgets));alert('Лимит сохранён');render()}if(a==='saveRates'){document.querySelectorAll('[data-rate]').forEach(i=>{let v=Number(i.value);if(v>0)rates[i.dataset.rate]=v});rates[base]=1;localStorage.setItem('finflow_base_currency',base);localStorage.setItem('finflow_rates',JSON.stringify(rates));alert('Курсы сохранены');setView('settings')}}});render();
</script></body></html>
